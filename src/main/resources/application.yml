micronaut:
  application:
    name: oda-media-service
  http.services.youtube.url: https://youtube.googleapis.com
flyway:
  datasources:
    default:
      enabled: true
      schemas: 'media'
      default-schema: 'media'
datasources:
  default:
    schema: 'media'
jpa:
  default:
    entity-scan:
        packages: 'io.github.opendonationassistant'
endpoints:
  prometheus:
    sensitive: false
  metrics:
    sensitive: false
